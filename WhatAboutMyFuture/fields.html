<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
      الحقول الأكاديمية | ماذا عن مستقبلي؟
    </title>
    <script src="shared/theme-init.js">
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/shared.css">
    <link rel="stylesheet" href="css/pages/fields.css">
    <script src="shared/site.js" defer>
    </script>
    <script src="js/utils.js" defer>
    </script>
    <script src="js/data/majors.js" defer>
    </script>
    <script src="js/data/fields-config.js" defer>
    </script>
    <script src="js/pages/fields.js" defer>
    </script>
  </head>
  <body class="page-fields" data-navigation="fields">
    <!-- ===== HEADER ===== -->
    <header id="site-header">
    </header>
    <!-- ===== MAIN CONTENT ===== -->
    <main>
      <section class="page-hero">
        <h1>
          اكتشف الحقل المناسب لتخصصك
        </h1>
        <p>
          اكتب اسم التخصص الجامعي لمعرفة الحقل المناسب، المواد المطلوبة، المعدل المتوقع، والتخصصات البديلة.
        </p>
      </section>
      <section class="search-section">
        <div class="search-card">
          <h2>
            ابحث عن تخصصك
          </h2>
          <div class="search-box">
            <div class="input-wrapper">
              <input type="text" id="majorInput" placeholder="ابحث عن تخصص..." autocomplete="off" aria-label="اسم التخصص" aria-controls="suggestionsList" aria-expanded="false">
              <ul id="suggestionsList" class="suggestions-list">
              </ul>
            </div>
            <button type="button" id="searchBtn">
              بحث
            </button>
          </div>
        </div>
      </section>
      <section class="result-section">
        <div id="result" class="result-card">
        </div>
      </section>
    </main>
    <!-- ===== FOOTER ===== -->
    <footer id="site-footer" class="footer">
    </footer>
    <!-- ===== SCRIPTS ===== -->
  </body>
</html>
