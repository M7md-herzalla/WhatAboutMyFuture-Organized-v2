name = "gemini-proxy"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
ALLOWED_ORIGINS = "https://whataboutmyfuture2.netlify.app,http://127.0.0.1:5500,http://localhost:5500"
   GEMINI_MODEL = "gemini-3.5-flash-lite"

# اختياري: حماية عدد الطلبات (rate limiting)
# 1) أنشئ KV namespace:  wrangler kv namespace create RATE_LIMIT_KV
# 2) حط الـ id اللي بيطلعلك تحت بدل REPLACE_WITH_KV_ID
# 3) شيل التعليق (#) عن الأسطر تحت

# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "REPLACE_WITH_KV_ID"
