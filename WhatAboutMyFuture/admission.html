<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
      معدلات القبول | What About My Future?
    </title>
    <script src="shared/theme-init.js">
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/shared.css">
    <link rel="stylesheet" href="css/pages/admission.css">
    <script src="shared/site.js" defer>
    </script>
    <script src="js/utils.js" defer>
    </script>
    <script src="js/data/universities.js" defer>
    </script>
    <script src="js/pages/admission.js" defer>
    </script>
  </head>
  <body class="page-admission" data-navigation="admission">
    <header id="site-header">
    </header>
    <main>
      <section class="hero">
        <div class="overlay">
        </div>
        <div class="container">
          <div class="hero-content">
            <h1>
              مستقبلك يبدأ من اختيارك الصحيح
            </h1>
            <h2>
              اكتشف معدلات القبول الجامعية
            </h2>
            <p>
              ساعدنا في العثور على التخصص المناسب لك من خلال استعراض الجامعات، ومعدلات القبول، ورسوم الساعات بطريقة سهلة وسريعة.
            </p>
            
          </div>
        </div>
      </section>
      <br>
      <section class="statistics">
        <div class="container">
          <div class="stat-card">
            <span class="icon">
              <i class="fa-solid fa-building-columns">
              </i>
            </span>
            <h2>
              10
            </h2>
            <p>
              جامعة حكومية
            </p>
          </div>
          <div class="stat-card">
            <span class="icon">
              <i class="fa-solid fa-building-columns">
              </i>
            </span>
            <h2>
              14
            </h2>
            <p>
              جامعة خاصة
            </p>
          </div>
          <div class="stat-card">
            <span class="icon">
              <i class="fa-solid fa-book-open">
              </i>
            </span>
            <h2>
              500+
            </h2>
            <p>
              تخصص
            </p>
          </div>
          
        </div>
      </section>
      <section class="filters">
        <div class="container">
          <div class="filter-box">
            <label for="universityFilter">
              الجامعة
            </label>
            <select id="universityFilter">
              <option value="all">
                جميع الجامعات
              </option>
            </select>
          </div>
          <div class="filter-box">
            <label for="collegeFilter">
              الكلية
            </label>
            <select id="collegeFilter">
              <option value="all">
                جميع الكليات
              </option>
            </select>
          </div>
          <div class="filter-box">
            <label for="sortFilter">
              ترتيب النتائج
            </label>
            <select id="sortFilter">
              <option value="high">
                الأعلى معدل
              </option>
              <option value="low">
                الأقل معدل
              </option>
            </select>
          </div>
          <button id="resetBtn" class="reset-btn" type="button">
            إعادة تعيين
          </button>
        </div>
      </section>
      <section class="universities">
        <div class="container">
          <div class="section-title">
            <h2>
              نتائج البحث
            </h2>
            <p id="resultsCount" aria-live="polite">
              التخصصات المسجلة في البيانات المتوفرة
            </p>
          </div>
          <div id="cardsContainer">
          </div>
        </div>
      </section>
    </main>
    <footer id="site-footer" class="footer">
    </footer>
  </body>
</html>
